<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Dropdown Menu - Responsive Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Enhanced dropdown styles */
        .dropdown-container {
            perspective: 1000px;
        }

        .dropdown-menu {
            animation: fadeIn 0.2s ease-out forwards;
            transform-origin: top center;
        }

        .dropdown-item {
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: #f0f9ff;
            transform: translateX(5px);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .dropdown-button {
                width: 100%;
                justify-content: center;
            }
            
            .dropdown-menu {
                width: 100%;
                left: 0;
                right: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-8">
        <div class="flex flex-col items-center space-y-8">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Enhanced Dropdown Menu</h1>
                <p class="text-gray-600">Modern responsive dropdown with animations</p>
            </div>

            <div class="w-full max-w-md dropdown-container relative">
                <button id="dropdownButton" class="dropdown-button flex items-center justify-between w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-all duration-300 shadow-md">
                    <span>Select an option</span>
                    <svg id="dropdownArrow" class="w-5 h-5 ml-2 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>

                <div id="dropdownMenu" class="dropdown-menu hidden absolute z-10 mt-2 w-full bg-white rounded-md shadow-lg overflow-hidden border border-gray-200">
                    <div class="py-1">
                        <a href="#" class="dropdown-item block px-4 py-3 text-gray-700 hover:text-blue-600">
                            <div class="flex items-center">
                                <img src="https://placehold.co/24x24" alt="Dashboard icon with blue gradient background" class="mr-3 w-6 h-6">
                                <span>Dashboard</span>
                            </div>
                        </a>
                        <a href="#" class="dropdown-item block px-4 py-3 text-gray-700 hover:text-blue-600">
                            <div class="flex items-center">
                                <img src="https://placehold.co/24x24" alt="Settings icon with gear symbol" class="mr-3 w-6 h-6">
                                <span>Settings</span>
                            </div>
                        </a>
                        <a href="#" class="dropdown-item block px-4 py-3 text-gray-700 hover:text-blue-600">
                            <div class="flex items-center">
                                <img src="https://placehold.co/24x24" alt="Profile icon with user silhouette" class="mr-3 w-6 h-6">
                                <span>Profile</span>
                            </div>
                        </a>
                        <a href="#" class="dropdown-item block px-4 py-3 text-gray-700 hover:text-blue-600">
                            <div class="flex items-center">
                                <img src="https://placehold.co/24x24" alt="Logout icon with arrow exiting door" class="mr-3 w-6 h-6">
                                <span>Log Out</span>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

            <div class="bg-gray-100 p-6 rounded-lg w-full max-w-md">
                <h2 class="font-semibold text-lg mb-3">Features:</h2>
                <ul class="space-y-2">
                    <li class="flex items-start">
                        <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                        <span>Smooth animations and transitions</span>
                    </li>
                    <li class="flex items-start">
                        <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                        <span>Fully responsive design</span>
                    </li>
                    <li class="flex items-start">
                        <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                        <span>Optimized for touch screens</span>
                    </li>
                    <li class="flex items-start">
                        <svg class="w-5 h-5 text-green-500 mr-2 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                        <span>Accessibility features</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const button = document.getElementById('dropdownButton');
            const menu = document.getElementById('dropdownMenu');
            const arrow = document.getElementById('dropdownArrow');
            
            let isOpen = false;

            function toggleDropdown() {
                isOpen = !isOpen;
                
                if (isOpen) {
                    menu.classList.remove('hidden');
                    menu.style.animation = 'fadeIn 0.2s ease-out forwards';
                    arrow.style.transform = 'rotate(180deg)';
                    button.classList.add('ring-2', 'ring-blue-300');
                } else {
                    menu.classList.add('hidden');
                    arrow.style.transform = 'rotate(0deg)';
                    button.classList.remove('ring-2', 'ring-blue-300');
                }
            }

            button.addEventListener('click', toggleDropdown);

            // Close when clicking outside
            document.addEventListener('click', function(event) {
                if (!button.contains(event.target) && !menu.contains(event.target)) {
                    if (isOpen) {
                        toggleDropdown();
                    }
                }
            });
        });
    </script>
</body>
</html>
